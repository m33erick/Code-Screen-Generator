kind = "web"
previewPath = "/"
title = "FVG Screener"
version = "1.0.0"
id = "artifacts/fvg-screener"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24276

[services.development]
run = "pnpm --filter @workspace/fvg-screener run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fvg-screener", "run", "build" ]
publicDir = "artifacts/fvg-screener/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24276"
BASE_PATH = "/"
